name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # Catches build-only failures (server/client boundary mistakes, bad
      # imports) that tsc alone does not surface. Placeholder secrets are enough
      # because nothing here reaches a live service.
      - name: Build
        run: pnpm build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB_NAME: billboard-hub-ci
          AUTH_SECRET: ci-placeholder-secret-value-32-chars
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
